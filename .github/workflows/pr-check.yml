name: PR Check

on:
  pull_request:
    branches: [main]

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    name: Analyze & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # verify_fixtures.py git-shows each shipped SHA
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.7"
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Do not run build_runner on 3.47.7: analyzer 7.6.0 hangs
      # (visitDotShorthandPropertyAccess). Generated files are committed.

      - name: Check formatting
        run: dart format --set-exit-if-changed lib/ test/

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Run tests
        run: flutter test

      - name: Data-safety gate
        run: scripts/data_safety_gate.sh

  generated-files:
    name: Generated files up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Codegen hangs on 3.47.7 (analyzer 7.6.0 missing
      # visitDotShorthandPropertyAccess). Regenerating here on 3.44.9
      # proves the committed *.g.dart / *.freezed.dart /
      # injection.config.dart still match the annotated sources.
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.9"
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Regenerate
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Compare generated files
        run: python3 tool/data_safety/compare_generated.py

  test-watchos:
    name: Build & Test watchOS
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Find watchOS simulator
        id: sim
        run: |
          SIM=$(xcrun simctl list devices available watchOS -j | python3 -c "
          import json,sys
          data = json.load(sys.stdin)
          for runtime, devices in data['devices'].items():
            if 'watchOS' in runtime:
              for d in devices:
                if d['isAvailable']:
                  print(d['name']); sys.exit(0)
          " 2>/dev/null || echo "Any watchOS Simulator Device")
          echo "name=$SIM" >> "$GITHUB_OUTPUT"

      - name: Build watchOS app
        working-directory: ios
        run: |
          xcodebuild -project Runner.xcodeproj \
            -scheme WODTimerWatch \
            -destination 'platform=watchOS Simulator,name=${{ steps.sim.outputs.name }}' \
            build

      - name: Run watchOS tests
        working-directory: ios
        run: |
          xcodebuild -project Runner.xcodeproj \
            -scheme WODTimerWatch \
            -destination 'platform=watchOS Simulator,name=${{ steps.sim.outputs.name }}' \
            test
